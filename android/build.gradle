// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    // Mirrors for better connectivity
    maven { url "https://maven.aliyun.com/repository/google" }
    maven { url "https://maven.aliyun.com/repository/central" }
    maven { url "https://repo.huaweicloud.com/repository/maven/" }
    // Must come first so AGP is found:
    google()
    mavenCentral()
  }
  dependencies {
    // Use version catalog to ensure consistent versions:
    classpath libs.android.gradle.plugin

    // React Native Gradle plugin:
    classpath "com.facebook.react:react-native-gradle-plugin:0.73.4"

    // Kotlin Gradle plugin:
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"

    // Google Services plugin:
    classpath 'com.google.gms:google-services:4.4.0'
  }
}

def reactNativeAndroidDir = new File(
        providers.exec {
          workingDir(rootDir)
          commandLine("node", "--print", "require.resolve('react-native/package.json')")
        }.standardOutput.asText.get().trim(),
        "../android"
)

allprojects {
  repositories {
    maven {
      // React Native Android artifacts
      url reactNativeAndroidDir
    }
    // Mirrors for better connectivity
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.aliyun.com/repository/google" }
    maven { url "https://maven.aliyun.com/repository/central" }
    maven { url "https://repo.huaweicloud.com/repository/maven/" }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
